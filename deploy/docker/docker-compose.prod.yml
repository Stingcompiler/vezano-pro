# Vezano Pro production containers, phase 3 of the container plan: two
# blue/green slots running IN PARALLEL with the systemd release. See
# deploy/docker/README.md.
#
#   blue   127.0.0.1:8001   container vezano-docker-blue
#   green  127.0.0.1:8002   container vezano-docker-green
#
# Run it through vezano-docker.sh (as root), which sets VEZANO_IMAGE_BLUE and
# VEZANO_IMAGE_GREEN (each pinned by digest, from
# /var/lib/vezano-docker/state.json) and VEZANO_UID/GID (from `id vezano`).
# Production traffic is untouched: Caddy keeps proxying to the systemd
# gunicorn on 127.0.0.1:8000 until the owner-approved phase 4 switch.
#
# The two services are identical except for the slot name, the image variable
# and the port (deploy/tests/test_docker.py checks that). No ports are
# published: host networking with gunicorn bound to loopback only.
#
# The containers never migrate: the image has no entrypoint and the command
# is gunicorn only. Schema changes stay with deploy/standalone/upgrade.sh.

name: vezano-docker

services:
  blue:
    image: ${VEZANO_IMAGE_BLUE:?VEZANO_IMAGE_BLUE is required (run through vezano-docker.sh)}
    container_name: vezano-docker-blue
    command: ["gunicorn", "config.wsgi:application", "-c", "gunicorn.conf.py"]
    network_mode: host
    env_file:
      - /etc/vezano/vezano.env
    environment:
      GUNICORN_BIND: "127.0.0.1:8001"
      PORT: "8001"                      # the image HEALTHCHECK probes $PORT
      MEDIA_ROOT: /var/lib/vezano/media
      WEB_CONCURRENCY: "2"
      VEZANO_ENV_FILE: /dev/null        # settings come from env_file only
    user: "${VEZANO_UID:?VEZANO_UID is required}:${VEZANO_GID:?VEZANO_GID is required}"
    volumes:
      - type: bind
        source: /var/lib/vezano/media
        target: /var/lib/vezano/media
        read_only: false
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "vezano-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.5
    pids_limit: 256
    logging:
      driver: journald
      options:
        tag: vezano-docker-blue

  green:
    image: ${VEZANO_IMAGE_GREEN:?VEZANO_IMAGE_GREEN is required (run through vezano-docker.sh)}
    container_name: vezano-docker-green
    command: ["gunicorn", "config.wsgi:application", "-c", "gunicorn.conf.py"]
    network_mode: host
    env_file:
      - /etc/vezano/vezano.env
    environment:
      GUNICORN_BIND: "127.0.0.1:8002"
      PORT: "8002"                      # the image HEALTHCHECK probes $PORT
      MEDIA_ROOT: /var/lib/vezano/media
      WEB_CONCURRENCY: "2"
      VEZANO_ENV_FILE: /dev/null        # settings come from env_file only
    user: "${VEZANO_UID:?VEZANO_UID is required}:${VEZANO_GID:?VEZANO_GID is required}"
    volumes:
      - type: bind
        source: /var/lib/vezano/media
        target: /var/lib/vezano/media
        read_only: false
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "vezano-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.5
    pids_limit: 256
    logging:
      driver: journald
      options:
        tag: vezano-docker-green
