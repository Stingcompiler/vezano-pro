name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deployment-checks:
    name: Deployment orchestration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate shell scripts
        run: bash -n deploy/standalone/upgrade.sh && bash -n deploy/standalone/backup.sh && bash -n deploy/ovh/install.sh && bash -n deploy/docker/install-docker.sh && bash -n deploy/docker/vezano-docker.sh
      - name: Test deployment and recovery controls
        run: python3 -m unittest discover -s deploy/tests -v

  backend:
    name: Backend (lint + checks + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Production runs on PostgreSQL; a SQLite-only suite let a Postgres-only
    # failure (FOR UPDATE on an outer join) reach production. Every test now
    # runs twice: once on SQLite (dev parity) and once on Postgres 16 (prod).
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: erp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://ci:ci@localhost:5432/erp_test' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Test the same runtime versions that release packaging installs.
        run: pip install -r requirements.txt -c requirements.lock

      - name: Repo structure audit (URL wiring + migration graph)
        run: python scripts/repo_audit.py

      - name: Lint (flake8)
        run: flake8 .

      # The compiled catalogue is committed (Render's build has no gettext);
      # this fails the build if someone edits django.po without recompiling.
      - name: Translation catalogue is compiled
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key
          DEBUG: "True"
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gettext >/dev/null
          python manage.py compilemessages -l ar
          git diff --exit-code -- locale/ || (echo "locale/*.mo is stale: run 'manage.py compilemessages -l ar' and commit" && exit 1)

      - name: Django system check
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key
          DEBUG: "True"
        run: python manage.py check

      - name: Migrations are in sync with models
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key
          DEBUG: "True"
        # Fails if any model change isn't captured in a committed migration —
        # verifies the hand-authored migrations match the models.
        run: python manage.py makemigrations --check --dry-run

      - name: Deployment checks (production settings)
        # Informational: runs Django's --deploy checks with production-like env.
        continue-on-error: true
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key
          DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: ".onrender.com"
        run: python manage.py check --deploy

      - name: Test (pytest)
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key
          DEBUG: "True"
        run: pytest -v

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Frontend behavior tests
        run: npm test

      - name: Build
        # Retried for the same reason as the E2E export build below: the
        # font download at build time occasionally gets an empty reply.
        run: |
          for attempt in 1 2 3; do
            npm run build && exit 0
            echo "Build attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Preserve the tested frontend export
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-${{ github.sha }}
          path: frontend/out/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  e2e-offline:
    # The offline-first contract in a real browser: build the export, serve
    # it from Django exactly as production does, take sales with the network
    # cut, reload from the service worker, reconnect, and check the server.
    name: E2E (offline POS in Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt -c requirements.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build the production export
        working-directory: frontend
        # next/font downloads the Google fonts at build time; an empty reply
        # from the font CDN fails the build with "Cannot read properties of
        # null (reading '1')" though nothing in the code changed. Retry the
        # build rather than the whole job; a real compile error fails all three.
        run: |
          for attempt in 1 2 3; do
            npm run build && exit 0
            echo "Build attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Migrate and seed the fixture company
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key
          DEBUG: "True"
        run: |
          python manage.py migrate -v0
          python manage.py seed_e2e

      - name: Serve the export from Django
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key
          DEBUG: "True"
        run: |
          nohup python manage.py runserver 8000 --noreload > /tmp/django.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/health/ >/dev/null && break; sleep 1; done
          curl -sf http://localhost:8000/sw.js | head -c 200

      - name: Run the offline suite
        working-directory: frontend
        env:
          CI: "true"
        run: npx playwright test

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            /tmp/django.log

  docker-dev:
    # Keeps the Docker files valid: the local development stack
    # (docs/docker.md) and, build-only, the production image target, which is
    # then smoke-tested exactly like prod-image does on main. Nothing is
    # pushed here. It runs in parallel and is NOT a dependency of deploy-ovh,
    # so it never gates or delays a deployment.
    name: Docker files (compose config + dev and production images)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: vezano_smoke
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - name: Validate deploy/docker/docker-compose.prod.yml (VPS parallel run)
        run: python3 -m unittest deploy/tests/test_docker.py -v
      - name: Build the backend images (dev + runtime targets)
        run: |
          docker build -f backend/Dockerfile --target dev -t vezano-backend:dev .
          docker build -f backend/Dockerfile -t vezano-backend:runtime .
      - name: Django system check inside the image
        run: >-
          docker run --rm -e DEBUG=True -e DJANGO_SECRET_KEY=ci-test-secret-key
          vezano-backend:dev python manage.py check
      - name: Build the frontend dev image
        run: docker build -t vezano-frontend:dev frontend
      - uses: docker/setup-buildx-action@v3
      - name: Build the production image (build only, not pushed)
        # Uses the committed frontend/out; prod-image on main uses the
        # frontend job's tested artifact instead.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: production
          load: true
          push: false
          provenance: false
          sbom: false
          tags: vezano-pro:ci
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}
          cache-from: type=gha,scope=prod-image
      - name: Smoke-test the production image
        run: bash docker/smoke-prod-image.sh vezano-pro:ci "$GITHUB_SHA"
      - name: Image sizes
        run: docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep vezano

  prod-image:
    # Phase 1 of the production container plan: build the production image
    # from the tested commit and frontend artifact, push it to GHCR, then
    # smoke-test the pushed digest. Production still deploys the systemd
    # release (deploy-ovh); this job runs beside it and never blocks it.
    name: Production image (GHCR push + smoke test)
    needs: [backend, frontend, e2e-offline]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: prod-image-main
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/stingcompiler/vezano-pro
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: vezano_smoke
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Remove the checkout export before restoring the tested artifact
        run: rm -rf -- frontend/out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-${{ github.sha }}
          path: frontend/out/
      - name: Tags and labels
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:8}"
          {
            echo "short=$short"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo 'tags<<EOF'
            echo "$IMAGE:sha-$GITHUB_SHA"
            echo "$IMAGE:sha-$short"
            echo "$IMAGE:main"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=prod-image
          cache-to: type=gha,scope=prod-image,mode=max
      - name: Print the image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Image: $IMAGE@$DIGEST"
          {
            echo "### Production image"
            echo
            echo "\`$IMAGE@$DIGEST\`"
            echo
            echo "Tags: \`sha-$GITHUB_SHA\`, \`sha-${{ steps.meta.outputs.short }}\`, \`main\`."
            echo "Production still deploys the systemd release; this image is not deployed yet."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke-test the pushed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          bash docker/smoke-prod-image.sh "$IMAGE@$DIGEST" "$GITHUB_SHA"

  deploy-ovh:
    name: Deploy Vezano Pro to OVH
    needs: [backend, frontend, e2e-offline, deployment-checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.OVH_AUTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ovh-production
      url: https://pro.vezano.app
    concurrency:
      group: ovh-production
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      OVH_DEPLOY_HOST: ${{ vars.OVH_DEPLOY_HOST }}
      OVH_DEPLOY_USER: ${{ vars.OVH_DEPLOY_USER }}
      OVH_DEPLOY_PORT: ${{ vars.OVH_DEPLOY_PORT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check this commit is still main HEAD
        id: latest
        shell: bash
        run: |
          set -euo pipefail
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit exists; skipping this deployment.'
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.latest.outputs.deploy == 'true'
        with:
          python-version: '3.12'
      - name: Remove the checkout export before restoring the tested artifact
        if: steps.latest.outputs.deploy == 'true'
        run: rm -rf -- frontend/out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.latest.outputs.deploy == 'true'
        with:
          name: frontend-${{ github.sha }}
          path: frontend/out/
      - name: Package the tested commit
        if: steps.latest.outputs.deploy == 'true'
        env:
          DJANGO_SECRET_KEY: ci-packaging-only-not-a-production-secret
          DEBUG: 'True'
          VEZANO_DEPLOYMENT_MODE: saas
          VEZANO_ENV_FILE: /dev/null
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet -r backend/requirements.lock
          VEZANO_PYTHON="$(command -v python)" bash deploy/standalone/package_release.sh \
            --output "$RUNNER_TEMP/vezano-release"
      - name: Upload and promote through the restricted SSH gateway
        if: steps.latest.outputs.deploy == 'true'
        env:
          OVH_DEPLOY_SSH_KEY: ${{ secrets.OVH_DEPLOY_SSH_KEY }}
          OVH_KNOWN_HOSTS: ${{ secrets.OVH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/ovh-deploy-key"
          hosts="$RUNNER_TEMP/ovh-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          test -n "$OVH_DEPLOY_SSH_KEY"
          test -n "$OVH_KNOWN_HOSTS"
          printf '%s\n' "$OVH_DEPLOY_SSH_KEY" > "$key"
          printf '%s\n' "$OVH_KNOWN_HOSTS" > "$hosts"
          archives=("$RUNNER_TEMP/vezano-release"/vezano-*.tar.gz)
          test "${#archives[@]}" -eq 1
          archive="${archives[0]}"
          digest="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          ssh_options=(-T -i "$key" -p "$OVH_DEPLOY_PORT" -o BatchMode=yes \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -o "UserKnownHostsFile=$hosts")
          target="$OVH_DEPLOY_USER@$OVH_DEPLOY_HOST"
          ssh "${ssh_options[@]}" "$target" "upload $GITHUB_SHA $digest" < "$archive"
          ssh "${ssh_options[@]}" "$target" "deploy $GITHUB_SHA $digest"
          curl --fail --silent --show-error --retry 3 --max-time 15 \
            --output /dev/null https://pro.vezano.app/api/health/
          printf 'Promoted commit `%s` to [Vezano Pro](https://pro.vezano.app).\n' \
            "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  deploy-docker-parallel:
    # Phase 3 of the container plan: start the pushed image in the inactive
    # blue/green slot on the VPS (127.0.0.1:8001/8002), in parallel with the
    # systemd release. Caddy is NOT switched here (that is the owner-approved
    # phase 4); production traffic stays on systemd :8000. Skipped until the
    # owner sets OVH_DOCKER_DEPLOY_ENABLED=true after re-running install.sh.
    # It waits for deploy-ovh (so the two backups never overlap) but runs
    # whatever deploy-ovh's result; deploy-ovh never waits for it.
    name: Deploy the container slot to OVH (parallel, no Caddy switch)
    needs: [prod-image, deploy-ovh, deployment-checks]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.OVH_DOCKER_DEPLOY_ENABLED == 'true' && needs.prod-image.result == 'success' && needs.deployment-checks.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: ovh-production
      url: https://pro.vezano.app
    concurrency:
      group: ovh-docker-parallel
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      OVH_DEPLOY_HOST: ${{ vars.OVH_DEPLOY_HOST }}
      OVH_DEPLOY_USER: ${{ vars.OVH_DEPLOY_USER }}
      OVH_DEPLOY_PORT: ${{ vars.OVH_DEPLOY_PORT }}
      IMAGE_DIGEST: ${{ needs.prod-image.outputs.digest }}
    steps:
      - name: Check this commit is still main HEAD
        id: latest
        shell: bash
        run: |
          set -euo pipefail
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit exists; skipping this deployment.'
          fi
      - name: Deploy the image digest through the restricted SSH gateway
        if: steps.latest.outputs.deploy == 'true'
        env:
          OVH_DEPLOY_SSH_KEY: ${{ secrets.OVH_DEPLOY_SSH_KEY }}
          OVH_KNOWN_HOSTS: ${{ secrets.OVH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "prod-image gave no digest"; exit 1; }
          key="$RUNNER_TEMP/ovh-deploy-key"
          hosts="$RUNNER_TEMP/ovh-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          test -n "$OVH_DEPLOY_SSH_KEY"
          test -n "$OVH_KNOWN_HOSTS"
          printf '%s\n' "$OVH_DEPLOY_SSH_KEY" > "$key"
          printf '%s\n' "$OVH_KNOWN_HOSTS" > "$hosts"
          ssh_options=(-T -i "$key" -p "$OVH_DEPLOY_PORT" -o BatchMode=yes \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 -o "UserKnownHostsFile=$hosts")
          target="$OVH_DEPLOY_USER@$OVH_DEPLOY_HOST"
          status=0
          ssh "${ssh_options[@]}" "$target" "deploy-image $GITHUB_SHA $IMAGE_DIGEST" || status=$?
          if [ "$status" -eq 10 ]; then
            echo "::warning::Pending migrations: the container slot was not changed. Apply them via the manual upgrade path."
          elif [ "$status" -eq 0 ]; then
            printf 'Container slot running commit `%s` (`%s`); Caddy unchanged.\n' \
              "$GITHUB_SHA" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
